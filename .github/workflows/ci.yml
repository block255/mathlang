name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: analyze + test (Windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: flutter version
        run: flutter --version

      - name: pub get
        run: flutter pub get

      - name: analyze（零告警是硬要求）
        run: flutter analyze --no-fatal-infos

      - name: test（全量，不许 skip）
        run: flutter test --reporter expanded
